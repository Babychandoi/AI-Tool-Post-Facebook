server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_url http://api:8080;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /v1/ai/chatgpt/callback { access_log off; proxy_pass $backend_url; proxy_set_header Host $http_host; proxy_read_timeout 30s; }
    location /v1/ { proxy_pass $backend_url; proxy_set_header Host $http_host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 30s; }
    location /oauth2/ { proxy_pass $backend_url; proxy_set_header Host $http_host; }
    location /login/ { proxy_pass $backend_url; proxy_set_header Host $http_host; }
    location / { try_files $uri $uri/ /index.html; }
}
