# Native PostgreSQL + private filesystem + process-local rate limit for local demo only.
server:
  address: 127.0.0.1
  port: ${PORTABLE_PORT:58080}
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:55433/postgres
    username: postgres
    password: postgres
management:
  health:
    redis:
      enabled: false
app:
  demo: true
  storage-backend: filesystem
  storage-directory: .runtime/media
  rate-limit-backend: memory
